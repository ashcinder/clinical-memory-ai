# Replace linji.internal.example and the example allowed subnet before installing.
# Include this file inside nginx's http {} context (e.g. sites-enabled or conf.d).
server {
    listen 443 ssl;
    server_name linji.internal.example;
    ssl_certificate /etc/clinical-memory/tls/fullchain.pem;
    ssl_certificate_key /etc/clinical-memory/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow 127.0.0.1;
    allow 192.168.10.0/24;
    deny all;

    location = / {
        # Ask the app to redirect to its canonical subpath after access checks.
        proxy_pass http://127.0.0.1:18090/clinical-memory;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /clinical-memory {
        proxy_pass http://127.0.0.1:18090;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /clinical-memory/ {
        # Preserve the subpath; do not add a trailing slash to proxy_pass.
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 190s;
        proxy_send_timeout 190s;
        client_max_body_size 22m;
    }
    location / { deny all; }
}
