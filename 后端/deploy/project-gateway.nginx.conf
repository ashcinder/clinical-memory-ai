server {
    listen 80 default_server;
    server_name 124.221.183.247;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl http2 default_server;
    server_name 124.221.183.247;
    ssl_certificate /etc/letsencrypt/live/124.221.183.247/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/124.221.183.247/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/platform;
    index index.html;
    include /etc/nginx/project-locations/*.conf;
    location / { try_files $uri $uri/ =404; }
}
