import groovy.json.JsonOutput
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.provider.Property
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.InputFile
import org.gradle.api.tasks.Optional
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.TaskAction

plugins { id 'com.android.application' }

abstract class GenerateIntranetNetworkConfig extends DefaultTask {
    @Input abstract Property<String> getServerHost()
    @Input abstract Property<Boolean> getAllowCleartext()
    @Optional @InputFile abstract RegularFileProperty getCaCertificate()
    @OutputDirectory abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void generate() {
        def resourceDir = outputDirectory.get().asFile
        // Remove stale trust anchors when rebuilding without a custom CA.
        resourceDir.deleteDir()
        def xmlDir = new File(resourceDir, 'xml')
        xmlDir.mkdirs()
        def customTrust = ''
        if (caCertificate.isPresent()) {
            def caFile = caCertificate.get().asFile
            if (caFile.getText('UTF-8').contains('PRIVATE KEY')) {
                throw new GradleException('禁止把证书私钥打包进 App')
            }
            def factory = java.security.cert.CertificateFactory.getInstance('X.509')
            def certificates = caFile.withInputStream { factory.generateCertificates(it) }
            if (certificates.isEmpty() || certificates.any { it.basicConstraints < 0 }) {
                throw new GradleException('linjiCaCertificate 必须只包含 X.509 CA 公钥证书')
            }
            def rawDir = new File(resourceDir, 'raw')
            rawDir.mkdirs()
            new File(rawDir, 'linji_intranet_ca.pem').text = certificates.collect { cert ->
                '-----BEGIN CERTIFICATE-----\n' + cert.encoded.encodeBase64().toString().replaceAll('(.{64})', '$1\n') + '\n-----END CERTIFICATE-----\n'
            }.join('')
            customTrust = """
    <domain-config>
        <domain includeSubdomains="false">${serverHost.get()}</domain>
        <trust-anchors>
            <certificates src="system" />
            <certificates src="@raw/linji_intranet_ca" />
        </trust-anchors>
    </domain-config>"""
        }
        new File(xmlDir, 'network_security_config.xml').text = """<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
    <base-config cleartextTrafficPermitted="${allowCleartext.get()}">
        <trust-anchors><certificates src="system" /></trust-anchors>
    </base-config>${customTrust}
    <debug-overrides><trust-anchors><certificates src="user" /></trust-anchors></debug-overrides>
</network-security-config>
"""
    }
}

// Optional site defaults. Empty means users enter their own LAN endpoint.
def localTest = (project.findProperty('linjiLocalTest') ?: 'false').toString().toBoolean()
def localDefault = localTest ? 'http://10.0.2.2:8000' : ''
def intranetUrl = (project.findProperty('linjiServerUrl') ?: localDefault).toString().trim().replaceAll('/+$', '')
def intranetUri = intranetUrl ? new URI(intranetUrl) : null
def localHttp = localTest && intranetUri?.scheme == 'http' && intranetUri?.host in ['10.0.2.2', 'localhost', '127.0.0.1']
if (intranetUri && ((intranetUri.scheme != 'https' && !localHttp) || !intranetUri.host || intranetUri.userInfo || intranetUri.query || intranetUri.fragment || intranetUri.path.endsWith('/api'))) {
    throw new GradleException('linjiServerUrl 必须为 HTTPS 服务基础地址，不含凭据、查询参数、片段或 /api')
}
def caPath = (project.findProperty('linjiCaCertificate') ?: '').toString().trim()
def caFile = caPath ? rootProject.file(caPath) : null
if (caFile && (!intranetUri || !caFile.isFile())) {
    throw new GradleException('使用 linjiCaCertificate 时需同时提供 linjiServerUrl 和存在的 CA 公钥证书文件')
}

android {
    namespace 'cn.linji.clinical'
    compileSdk 33
    defaultConfig {
        applicationId (project.findProperty('linjiPreviewId') ?: 'cn.linji.clinical')
        minSdk 26
        targetSdk 33
        versionCode 57
        versionName (localTest ? '2.29.0-local' : intranetUrl == 'https://124.221.183.247/clinical-memory' ? '2.29.0-public' : '2.29.0-intranet')
        buildConfigField 'String', 'DEFAULT_SERVER_URL', JsonOutput.toJson(intranetUrl)
    }
    sourceSets.main.assets.srcDir rootProject.file('../前端Web/organizer-demo')
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant ->
        if (localTest) variant.enable = false
    }
    onVariants(selector().all()) { variant ->
        def generator = tasks.register("generate${variant.name.capitalize()}IntranetNetworkConfig", GenerateIntranetNetworkConfig) {
            serverHost.set(intranetUri?.host ?: '')
            allowCleartext.set(variant.buildType == 'debug')
            if (caFile) caCertificate.set(caFile)
            outputDirectory.set(layout.buildDirectory.dir("generated/res/intranet/${variant.name}"))
        }
        variant.sources.res.addGeneratedSourceDirectory(generator, { it.outputDirectory })
    }
}
